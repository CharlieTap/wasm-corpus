[package]
name = "wasm-corpus-wasmtime-runner"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wasmtime = { version = "=47.0.2", features = ["component-model"] }
wasmtime-wasi = { version = "=47.0.2", features = ["p3"] }
wasmtime-wasi-http = { version = "=47.0.2", default-features = false, features = ["p2", "p3"] }
