name: Corpus Submission

on:
  pull_request:
    paths:
      - "**/*.wasm"
      - "1.0/*.json"
      - "2.0/*.json"
      - "3.0/*.json"
      - "experimental/*.json"
      - "lib/**"
      - "package-lock.json"
      - "package.json"
      - "schema/*.json"
      - "scripts/**"
      - "tsconfig.json"
      - "runners/**"
      - "corpus"
  push:
    branches:
      - main
    paths:
      - "**/*.wasm"
      - "1.0/*.json"
      - "2.0/*.json"
      - "3.0/*.json"
      - "experimental/*.json"
      - "lib/**"
      - "package-lock.json"
      - "package.json"
      - "schema/*.json"
      - "scripts/**"
      - "tsconfig.json"
      - "runners/**"
      - "corpus"

jobs:
  validate-and-execute:
    runs-on: ubuntu-26.04
    env:
      BINARYEN_VERSION: "125"
      WASM_TOOLS_VERSION: "1.248.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Binaryen
        id: cache-binaryen
        uses: actions/cache@v4
        with:
          path: ~/.cache/wasm-corpus/binaryen-${{ env.BINARYEN_VERSION }}
          key: binaryen-${{ runner.os }}-${{ runner.arch }}-${{ env.BINARYEN_VERSION }}

      - name: Install Binaryen
        if: steps.cache-binaryen.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/wasm-corpus/binaryen-${BINARYEN_VERSION}
          curl -L "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" -o /tmp/binaryen.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C ~/.cache/wasm-corpus/binaryen-${BINARYEN_VERSION} --strip-components=1

      - name: Add Binaryen to PATH
        run: echo "$HOME/.cache/wasm-corpus/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Cache wasm-tools
        id: cache-wasm-tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-tools
          key: wasm-tools-${{ runner.os }}-${{ env.WASM_TOOLS_VERSION }}

      - name: Install wasm-tools
        if: steps.cache-wasm-tools.outputs.cache-hit != 'true'
        run: cargo install wasm-tools --version "${WASM_TOOLS_VERSION}" --locked

      - name: Install Node tooling
        run: npm ci

      - name: Type-check Node tooling
        run: npm run typecheck

      - name: Test Node tooling
        run: npm test

      - name: Cache Wasmtime runner
        id: cache-wasmtime-runner
        uses: actions/cache@v4
        with:
          path: runners/wasmtime/target/release/wasm-corpus-wasmtime-runner
          key: wasmtime-runner-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runners/wasmtime/Cargo.lock', 'runners/wasmtime/Cargo.toml', 'runners/wasmtime/src/**') }}

      - name: Build Wasmtime runner
        if: steps.cache-wasmtime-runner.outputs.cache-hit != 'true'
        run: cargo build --release --locked --manifest-path runners/wasmtime/Cargo.toml

      - name: Derive changed Wasm fixtures
        id: wasm-files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            git diff-tree --root --name-only --diff-filter=AM "$head" > changed-files.txt
          else
            git diff --name-only --diff-filter=AM "$base" "$head" > changed-files.txt
          fi

          validate_all=false
          : > wasm-files.unsorted

          while IFS= read -r file; do
            case "$file" in
              lib/*|package-lock.json|package.json|scripts/*|schema/*|runners/*|tsconfig.json|corpus)
                validate_all=true
                ;;
              *.wasm)
                printf '%s\n' "$file" >> wasm-files.unsorted
                ;;
              [123].0/*.json|experimental/*.json)
                wasm="${file%.json}.wasm"
                if [[ -f "$wasm" ]]; then
                  printf '%s\n' "$wasm" >> wasm-files.unsorted
                fi
                ;;
            esac
          done < changed-files.txt

          if [[ "$validate_all" == "true" ]]; then
            find 1.0 2.0 3.0 experimental -maxdepth 1 -name '*.wasm' | sort > wasm-files.txt
          else
            sort -u wasm-files.unsorted > wasm-files.txt
          fi

          if [[ -s wasm-files.txt ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            cat wasm-files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No WASM files need validation."
          fi

      - name: Validate Wasm fixtures
        if: steps.wasm-files.outputs.has_files == 'true'
        shell: bash
        run: |
          mapfile -t files < wasm-files.txt
          ./scripts/validate "${files[@]}"

      - name: Execute Wasm fixtures
        if: steps.wasm-files.outputs.has_files == 'true'
        shell: bash
        run: |
          mapfile -t files < wasm-files.txt
          ./scripts/execute "${files[@]}"
